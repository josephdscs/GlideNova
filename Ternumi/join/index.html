<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join your partner on Ternumi</title>
<meta name="robots" content="noindex">
<meta name="description" content="Your partner invited you to Ternumi: notes and doodles that land on each other's widget.">
<link rel="icon" href="../icon.png">
<script defer data-website-id="0709534x5w3s5763" src="https://minilytics.3joseph3.workers.dev/js/script.js"></script>
<style>
  :root { --cream:#FBF4EE; --rose:#E35A6B; --ink:#2B1E2F; --soft:rgba(43,30,47,.62); --butter:#F6D77A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--cream); color:var(--ink);
         font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; padding:24px; }
  main { width:100%; max-width:380px; text-align:center; }
  .icon { width:84px; height:84px; border-radius:20px; box-shadow:0 6px 20px rgba(43,30,47,.15); }
  h1 { font-size:26px; margin:20px 0 8px; line-height:1.2; }
  p { color:var(--soft); font-size:16px; line-height:1.45; margin:0 0 20px; }
  .note { background:var(--butter); border-radius:18px; padding:18px 12px; margin:0 0 22px; transform:rotate(-1.5deg); }
  .note small { display:block; font-size:13px; color:var(--soft); margin-bottom:4px; }
  .code { font-size:40px; font-weight:800; letter-spacing:.14em; font-variant-numeric:tabular-nums; }
  .btn { display:block; width:100%; padding:16px; border-radius:16px; font-size:17px; font-weight:700;
         text-decoration:none; margin-bottom:12px; }
  .primary { background:var(--rose); color:#fff; }
  .secondary { background:#fff; color:var(--ink); }
  .help { font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <img class="icon" src="../icon.png" alt="" onerror="this.hidden=true">
  <h1 data-i18n="title">Your partner invited you to Ternumi</h1>
  <p data-i18n="lead">Send each other little notes and doodles that land right on your home screen widget.</p>

  <div class="note" id="codeBox" hidden>
    <small data-i18n="codeLabel">Your invite code</small>
    <div class="code" id="code"></div>
  </div>

  <a class="btn primary" id="open" href="ternumi://join" data-ml-goal="ternumi_join_open" data-i18n="open">Open in Ternumi</a>
  <a class="btn secondary" id="store" href="https://glidenova.com/Ternumi/" data-ml-goal="appstore_ternumi" data-i18n="get">Get Ternumi</a>
  <p class="help" data-i18n="help">No app yet? Install Ternumi, sign in and type the code above under "Got a code?". It expires in 48 hours.</p>
</main>
<script>
  const T = {
    es: {
      title: "Tu pareja te ha invitado a Ternumi",
      lead: "Enviaos notas y dibujitos que aparecen directamente en el widget de la pantalla de inicio.",
      codeLabel: "Tu código de invitación",
      open: "Abrir en Ternumi",
      get: "Descargar Ternumi",
      help: "¿Aún no tienes la app? Instala Ternumi, inicia sesión y escribe el código de arriba en «¿Tienes un código?». Caduca en 48 horas."
    }
  };
  const lang = (navigator.language || "en").slice(0, 2);
  if (T[lang]) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = T[lang][el.dataset.i18n]; if (v) el.textContent = v;
    });
    document.title = T[lang].title;
  }
  const code = (new URLSearchParams(location.search).get("code") || "").replace(/\D/g, "").slice(0, 6);
  if (code.length === 6) {
    document.getElementById("code").textContent = code;
    document.getElementById("codeBox").hidden = false;
    document.getElementById("open").href = "ternumi://join?code=" + code;
  }
</script>
</body>
</html>
